site_name: ip_info
site_description: "Queries multiple providers for information about IP addresses."
site_url: https://DrollRobot.github.io/ip_info/
repo_url: https://github.com/DrollRobot/ip_info

theme:
  name: material
  features:
    - navigation.sections     # collapsible sections in left nav
    - navigation.expand       # expand all by default
    - content.code.copy       # copy button on code blocks
    - search.highlight

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Providers: providers.md
  - Reference: reference/ip_info.md

markdown_extensions:
  - admonition                # !!! note style callouts
  - pymdownx.superfences      # fenced code with language detection
  - pymdownx.highlight        # syntax highlighting
  - pymdownx.inlinehilite     # inline `code` highlighting
  - toc:
      permalink: true         # anchor link on each heading

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true

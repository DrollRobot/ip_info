# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.x"

      # FIXME uncomment if using Github app tokens to access private repos
      # - name: Mint a token for private git deps
      #   id: app-token
      #   # Best practice to use specific commit hashes of external dependencies
      #   # Find major tag commit hashes:
      #   # gh api repos/actions/create-github-app-token/tags --jq '.[] | "\(.name) \(.commit.sha)"
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   with:
      #     app-id: ${{ vars.GRAPH_AUTH_CLIENT_ID }}
      #     private-key: ${{ secrets.GRAPH_AUTH_APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: repo1, repo2

      # - name: Authenticate git to private deps
      #   run: |
      #     git config --global \
      #       url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
      #       "https://github.com/"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration"

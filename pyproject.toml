[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { ip_info = ["py.typed", "iso_country_codes.csv"] }

[project]
name = "ip_info"
version = "1.8.0"
description = "Queries multiple providers for information about IP addresses."
readme = "README.md"
requires-python = "~=3.14.10"
dependencies = [
    "ipinfo (>=5.1.1,<6)",
    # Required, not only an extra: the OS keyring is ip_info's only secret backend.
    "keyring (>=25.6.0,<26)",
    "platformdirs>=4.3,<5",
    "pyperclip (>=1.9.0,<2)",
    "requests (>=2.32.4,<3)",
    "tabulate (>=0.9.0,<1)",
    "tomlkit>=0.13,<1",
    "tzdata (>=2026.1,<2027.0)",
]

[project.optional-dependencies]
# Credential-backend extras: each installs what one secret backend needs, so
# the end user picks a backend at install time (e.g. 'uv sync --extra keyring'
# or 'pip install <package>[keyvault]'). Contributors install all of them with
# 'uv sync --all-extras'. Delete an extra together with its backend module.
keyring = [
    "keyring>=25.0,<26",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",  # GHSA-xvg9-69gf-fjrf
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov>=7.1,<8",
]
secrets = [
    "detect-secrets>=1.5,<2",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "secrets"},
    "debugpy>=1.8,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "pre-commit-hooks>=6.0,<7",
    "ruff>=0.15,<1",
    "types-pyperclip>=1.11.0.20260508",
    "types-tabulate>=0.10.0.20260508",
    "vulture>=2.16,<3",
]

[tool.uv]
# Oldest uv that can install the Python versions CI tests. CI installs the
# newest uv that meets it; local uv refuses to run if older.
required-version = ">=0.13.7"
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5; prune when upstream requires it
    "virtualenv>=21.14.9",  # GHSA-hhxq-47xx-j5xx and 11 more; prune when upstream requires it
]

[tool.uv.extra-build-variables]
# PyYAML has no prebuilt cp315 wheel, so on that Python it builds from source, and
# its optional C extension needs a compiler (MSVC on Windows). Build it as pure Python.
# Remove once PyYAML publishes a cp315 wheel.
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

[project.scripts]
ip_info = "ip_info.main:cli"
ipi = "ip_info.main:cli"
ip-info-config = "ip_info.config.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=ip_info",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    "slow: long-running",
]

[tool.ruff]
line-length = 100
# No target-version: ruff takes it from requires-python.

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine
".local/tests/**" = ["D", "ANN", "S101"]  # same, for tests kept out of git

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "src",
    "tests",
    "scripts",
]
mypy_path = [
    "scripts",
]

# AGENTS: ONLY ADD OVERRIDES IF, AFTER RESEARCHING, THERE IS NO TYPE STUB AVAILABLE.
[[tool.mypy.overrides]]
module = ["ipinfo"]  # no type stubs published
ignore_missing_imports = true

[tool.vulture]
paths = [
    "src",
    "scripts",
]
min_confidence = 60
ignore_names = [
    "*_api_key",  # Settings fields, read by name: getattr(settings, f"{api}_api_key")
    "_CredentialBackend",
    "MIN_PADDING",  # tabulate's module setting, assigned to configure the library
    "row_factory",  # sqlite3.Connection attribute, assigned to configure the connection
    # Provider functions, looked up by name in main.py: globals().get(api_name)
    "abstractapicom",
    "abuseipdbcom",
    "criminalipio",
    "ip2locationio",
    "ipapico",
    "ipapicom",
    "ipapiis",
    "ipapiorg",
    "ipdashapicom",
    "ipgeolocationio",
    "ipinfoio",
    "ipqueryio",
    "ipregistryco",
    "virustotalcom",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "ip_info"
version = "1.7.1"
description = "Queries multiple providers for information about IP addresses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipinfo (>=5.1.1,<6.0.0)",
    "keyring (>=25.6.0,<26.0.0)",
    "pyperclip (>=1.9.0,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "sqlite4 (>=0.1.1,<0.2.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "tzdata (>=2026.1,<2027.0)",
]

[dependency-groups]
dev = [
  "debugpy >=1.8.0,<2",
  "pytest>=9.0.0,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
]

[project.scripts]
ip_info = "ip_info.main:cli"
ipi = "ip_info.main:cli"
ip_info_keys = "ip_info.keys:ip_info_keys"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra"
python_files = ["test_*.py"]
python_functions = ["test_*"]


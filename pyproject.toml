[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { ip_info = ["py.typed", "iso_country_codes.csv"] }

[project]
name = "ip_info"
version = "1.8.0"
description = "Queries multiple providers for information about IP addresses."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipinfo (>=5.1.1,<6)",
    "keyring (>=25.6.0,<26)",
    "pyperclip (>=1.9.0,<2)",
    "requests (>=2.32.4,<3)",
    "tabulate (>=0.9.0,<1)",
    "tzdata>=2026.3,<2027.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0.6,<2",
]
test = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1.2,<2",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    "debugpy>=1.8,<2",
    "mypy>=2.2.0,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15.21,<1",
    "types-pyperclip>=1.11.0.20260508",
    "types-tabulate>=0.10.0.20260508",
]

[project.scripts]
ip_info = "ip_info.main:cli"
ipi = "ip_info.main:cli"
ip_info_keys = "ip_info.keys:ip_info_keys"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=ip_info",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: requires a populated .env (network/credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["stubs"]  # hand-written type stubs, not project source

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["scripts"]

[[tool.mypy.overrides]]
module = "ipinfo" # no type stubs available
ignore_missing_imports = true
